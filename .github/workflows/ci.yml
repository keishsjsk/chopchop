name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libfontconfig1 libdbus-1-3 libmpv2 ffmpeg fonts-dejavu-core
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true  # без ffmpeg интеграционные тесты видео просто пропускаются
        run: choco install ffmpeg --no-progress -y
      - name: Установка
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Линтер
        run: |
          ruff check .
          ruff format --check .
      - name: Типы
        run: mypy
      - name: Тесты
        run: pytest
      - name: Безопасность
        if: runner.os == 'Linux'
        run: |
          bandit -c pyproject.toml -r src packaging -q
          pip-audit
