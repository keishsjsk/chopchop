name: Release

# Релиз выпускается по тегу вида v0.1.0: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # пробная сборка вручную: собирает всё, но релиз не публикует

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Версия тега совпадает с версией программы
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          pip install -e .
          python -c "import chopchop, sys; tag = '${{ github.ref_name }}'; sys.exit(0 if tag == 'v' + chopchop.__version__ or tag.startswith('v' + chopchop.__version__ + '-') else 'тег ' + tag + ' не соответствует версии ' + chopchop.__version__)"
      - name: Зависимости сборки
        run: pip install -e ".[build]"
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Сборка (папка, портативный zip, установщик)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libfontconfig1 libdbus-1-3 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 fonts-dejavu-core
      - name: Зависимости сборки
        run: pip install -e ".[build]"
      - name: Сборка AppImage
        run: bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SBOM (CycloneDX)
        run: |
          pip install -e ".[build]"
          cyclonedx-py environment --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  release:
    needs: [windows, linux, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Контрольные суммы
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Заметки из CHANGELOG.md
        run: python packaging/release_notes.py "${{ github.ref_name }}" > notes.md
      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # тег с дефисом (v0.1.0-beta.1, v0.2.0-rc.1) — пре-релиз
          flags=""
          case "${{ github.ref_name }}" in *-*) flags="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" artifacts/* $flags \
            --title "CHOPCHOP ${{ github.ref_name }}" --notes-file notes.md
