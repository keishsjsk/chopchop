[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chopchop"
version = "0.1.0"
description = "Лёгкий плеер и быстрый редактор фото и видео"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.7,<7",
    "Pillow>=10.4",
    "pillow-heif>=0.18",
    "python-mpv>=1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
build = [
    "pyinstaller>=6.10",
    "cyclonedx-bom>=4.5",
]

[project.scripts]
chopchop = "chopchop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chopchop"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# faulthandler печатает внутренние исключения LuaJIT из libmpv (0xe24c4a02) как «фатальные»
addopts = "-p no:faulthandler"
pythonpath = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mpv"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# проверки пикселей: getpixel() в Pillow возвращает широкий тип
module = ["test_image_engine", "test_session", "test_video_effects_export"]
disable_error_code = ["index", "misc"]

[tool.bandit]
# B101: assert используется для сужения типов, а не для проверки данных пользователя.
# B404/B603: ffmpeg и ffprobe запускаются списком аргументов без shell, имена файлов не
# превращаются в команды; пути к исполняемым файлам берутся только из папки программы и PATH.
skips = ["B101", "B404", "B603"]
